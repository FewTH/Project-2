version: "3.0"
services:
   assess-app:
     container_name: assess-app
     build: 
       context: ./nginx8.4
     working_dir: /app
     ports:
       - "8320:80"
     networks:
       - assess_net
     volumes:
       #- ./www:/app
       - ./app:/app
       #- ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
     restart: always
     environment:
       APPLICATION_UID: "9999"  # <-- แทนที่ 1000 ด้วย UID ของคุณ
       APPLICATION_GID: "9999"  # <-- แทนที่ 1000 ด้วย GID ของคุณ
       DB_CONNECTION: mysql
       DB_HOST: assess-db
       DB_PORT: 3306
       DB_DATABASE: assess_db
       DB_USERNAME: assess
       DB_PASSWORD: "Assess@2025."

   assess-db:
     container_name: assess-db
     image: mysql:8.4.7
     volumes:
       - db-data:/var/lib/mysql
     environment:
       MYSQL_ROOT_PASSWORD: "Assess@2025."
       MYSQL_DATABASE: assess_db
       MYSQL_USER: assess
       MYSQL_PASSWORD: "Assess@2025."
     ports:
       - "8321:3306" # DB Port
     networks:
       - assess_net
     restart: always
     depends_on:
       - assess-db

   assess-myadmin:
     container_name: assess-myadmin
     image: phpmyadmin/phpmyadmin
     environment:
       PMA_HOST: assess-db
       MYSQL_ROOT_PASSWORD: "Assess@2025."
     ports:
       - "8322:80" # MyAdmin Port
     networks:
       - assess_net
     restart: always

networks:
   assess_net:
     driver: bridge
volumes:
   db-data:
