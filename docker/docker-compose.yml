version: "3.0"
services:
   assess-app:
     container_name: assess-app
     build: 
       context: ./nginx8.4
     working_dir: /app
     ports:
       - "8323:80"
     networks:
       - assess_net
     volumes:
       #- ./www:/app
       - ./app:/app
       #- ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
     restart: always
     depends_on:
       - assess-db
     environment:
       APPLICATION_UID: "9999"
       APPLICATION_GID: "9999"
       DB_CONNECTION: mysql
       DB_HOST: assess-db
       DB_PORT: 3306
       DB_DATABASE: buu-gift
       DB_USERNAME: assess
       DB_PASSWORD: "Assess@2025."
   assess-db:
     container_name: assess-db
     image: mysql:8.4.7
     volumes:
       - db-data:/var/lib/mysql
     environment:
       MYSQL_ROOT_PASSWORD: "Assess@2025."
       MYSQL_DATABASE: buu-gift
       MYSQL_USER: assess
       MYSQL_PASSWORD: "Assess@2025."
     ports:
       - "8324:3306"
     networks:
       - assess_net
     restart: always
   assess-myadmin:
     container_name: assess-myadmin
     image: phpmyadmin/phpmyadmin
     environment:
       PMA_HOST: assess-db
       MYSQL_ROOT_PASSWORD: "Assess@2025."
     ports:
       - "8325:80"
     networks:
       - assess_net
     restart: always
networks:
   assess_net:
     driver: bridge
volumes:
   db-data: